<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provincial Chapter Portal | KKDAT II</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0d1b3e; 
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Added padding for mobile edges */
            padding: 1rem;
        }

        /* --- Optimized Mobile Blobs --- */
        .blob-container { position: fixed; width: 100vw; height: 100vh; top: 0; left: 0; z-index: -1; overflow: hidden; }
        .blob { position: absolute; background: linear-gradient(180deg, rgba(59, 130, 246, 0.2) 0%, rgba(37, 99, 235, 0.05) 100%); border-radius: 50%; filter: blur(60px); animation: float 20s infinite alternate; opacity: 0.8; }
        
        /* Scaling blobs for mobile */
        .blob1 { width: 300px; height: 300px; top: -5%; left: -10%; }
        .blob2 { width: 400px; height: 400px; bottom: -10%; right: -5%; background: rgba(29, 78, 216, 0.15); }

        @media (min-width: 768px) {
            .blob1 { width: 500px; height: 500px; }
            .blob2 { width: 600px; height: 600px; }
            body { padding: 1.5rem; }
        }

        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(20px, 30px) scale(1.05); } }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.85) !important; 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        input, textarea { background-color: rgba(255, 255, 255, 0.6) !important; color: #1e293b !important; font-size: 16px !important; } /* 16px prevents iOS zoom on focus */
        input:focus, textarea:focus { background-color: #ffffff !important; border-color: #4f46e5 !important; }
        
        /* Smooth transition for hidden elements */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="blob-container">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
    </div>

    <div id="accessModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md px-4">
        <div class="glass-panel rounded-[2rem] md:rounded-[2.5rem] p-6 md:p-10 max-w-md w-full shadow-2xl border border-white/40 text-center">
            <div class="w-16 h-16 md:w-20 md:h-20 bg-slate-900 rounded-full flex items-center justify-center mx-auto mb-4 md:mb-6 border-4 border-white shadow-xl">
                <img src="LOGO.png" alt="Logo" class="w-10 h-10 md:w-14 md:h-14 object-contain">
            </div>
            <h2 class="text-xl md:text-2xl font-black text-slate-900 mb-2 uppercase tracking-tight">Portal Access</h2>
            <p class="text-slate-500 text-xs md:text-sm mb-6 md:mb-8">Enter your Chapter Passcode to begin.</p>
            
            <form id="loginForm" class="space-y-4">
                <input type="password" id="passcode" placeholder="••••" required 
                    class="w-full px-4 py-3 md:py-4 border-2 border-slate-200 rounded-xl md:rounded-2xl focus:outline-none text-center text-xl md:text-2xl tracking-[0.5em] font-bold">
                <div id="loginError" class="hidden text-rose-600 text-[10px] font-bold uppercase tracking-widest bg-rose-50 py-2 rounded-lg">
                    Invalid Credentials
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-bold py-3.5 md:py-4 rounded-xl md:rounded-2xl transition-all shadow-lg active:scale-95">
                    VERIFY & ENTER
                </button>
            </form>
            <a href="index.html" class="inline-block mt-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest hover:text-slate-600">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Hub
            </a>
        </div>
    </div>

    <main id="mainContent" class="hidden w-full max-w-xl glass-panel rounded-[2rem] md:rounded-[2.5rem] overflow-hidden shadow-2xl relative">
        <div class="bg-slate-900 p-6 md:p-8 text-white">
            <div class="flex items-center justify-between mb-4">
                <div class="px-2.5 py-1 bg-indigo-500/20 rounded-full border border-indigo-500/30 text-[8px] md:text-[9px] font-black uppercase tracking-widest text-indigo-300">
                    Active Session
                </div>
                <button onclick="location.reload()" class="text-slate-500 hover:text-rose-400 transition text-[10px] md:text-xs font-bold uppercase tracking-widest">
                    <i class="fa-solid fa-power-off mr-1"></i> Exit
                </button>
            </div>
            <h1 class="text-xl md:text-2xl font-bold">Registry Submission</h1>
            <p id="welcomeUser" class="text-slate-400 text-[10px] md:text-xs mt-1 font-medium italic"></p>
        </div>

        <form id="submissionForm" class="p-6 md:p-8 space-y-4 md:space-y-6">
            <div class="space-y-2">
                <label class="text-[9px] md:text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Facebook Post URL</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 md:pl-5 text-indigo-500">
                        <i class="fa-brands fa-facebook-f text-sm"></i>
                    </span>
                    <input type="url" id="fbLink" placeholder="https://facebook.com/..." required 
                        class="w-full pl-10 md:pl-12 pr-4 md:pr-6 py-3 md:py-4 border-2 border-slate-200 rounded-xl md:rounded-2xl focus:outline-none transition-all font-medium text-sm md:text-base">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[9px] md:text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Context</label>
                <textarea id="caption" rows="3" md:rows="4" placeholder="Title of the activity..." required
                    class="w-full px-4 md:px-6 py-3 md:py-4 border-2 border-slate-200 rounded-xl md:rounded-2xl focus:outline-none transition-all resize-none font-medium text-sm md:text-base"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 md:py-5 rounded-xl md:rounded-2xl shadow-xl shadow-indigo-200 transition-all flex items-center justify-center gap-3 active:scale-95 text-sm md:text-base">
                <i class="fa-solid fa-cloud-arrow-up"></i> PUSH TO REGISTRY
            </button>
        </form>

        <div id="statusMsg" class="hidden mx-6 md:mx-8 mb-6 md:mb-8 p-4 rounded-xl text-center font-bold text-[10px] md:text-xs uppercase tracking-widest"></div>
    </main>

    <script>
        // Update this with your exact Apps Script Web App URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbza0oazB-RAr9kuUP8uvLzeHV2Ynv12R_lmq5IYCNNHlYju14h6T9kDhm6Ke_b741SY/exec';

        const passcodeMap = {
            "2005-06-07": { name: "JOYCE ANN CUMLAT", chapter: "BANGUI CHAPTER" },
            "2002-10-05": { name: "JOHN DAVE BALLESTEROS", chapter: "CARASI CHAPTER" },
            "2006-01-24": { name: "WILLIE ASUNCION", chapter: "CURRIMAO CHAPTER" },
            "2007-09-16": { name: "AMIR JOSHUA IGNACIO", chapter: "DINGRAS CHAPTER" },
            "2008-09-01": { name: "DIANA NATIVIDAD", chapter: "DUMALNEG CHAPTER" },
            "2003-09-29": { name: "GRETCHEN ORONG", chapter: "PAGUDPUD CHAPTER" },
            "2003-09-06": { name: "JANELLE CABUNTOCAN", chapter: "PAOAY CHAPTER" },
            "2009-08-22": { name: "DAVID RENZ GARCIA", chapter: "PASUQUIN CHAPTER" },
            "2000-12-01": { name: "CHUCHI ANTALAN", chapter: "PINILI CHAPTER" },
            "2009-05-13": { name: "XYBERGHTEIN EURY VALERA", chapter: "PROVINCIAL PIO" }
        };

        const loginForm = document.getElementById('loginForm');
        const submissionForm = document.getElementById('submissionForm');

        // Handle Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const code = document.getElementById('passcode').value;
            const user = passcodeMap[code];

            if (user) {
                sessionStorage.setItem('chapterUser', user.name);
                sessionStorage.setItem('chapterName', user.chapter);
                document.getElementById('welcomeUser').innerText = `Authorized: ${user.name} | ${user.chapter}`;
                document.getElementById('accessModal').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
                document.getElementById('passcode').value = '';
            }
        });

        // Handle Submission
        submissionForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMsg');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> SYNCING...';

            const payload = {
                name: sessionStorage.getItem('chapterUser'),
                chapter: sessionStorage.getItem('chapterName'),
                link: document.getElementById('fbLink').value,
                caption: document.getElementById('caption').value
            };

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });

                status.classList.remove('hidden');
                status.className = "mx-6 md:mx-8 mb-6 md:mb-8 p-4 rounded-xl text-center font-bold text-[10px] md:text-xs uppercase tracking-widest bg-emerald-100 text-emerald-700 border border-emerald-200";
                status.innerHTML = '<i class="fa-solid fa-check-circle mr-2"></i> Pushed Successfully';
                submissionForm.reset();
            } catch (err) {
                status.classList.remove('hidden');
                status.className = "mx-6 md:mx-8 mb-6 md:mb-8 p-4 rounded-xl text-center font-bold text-[10px] md:text-xs uppercase tracking-widest bg-rose-100 text-rose-700 border border-rose-200";
                status.innerText = 'Network Sync Failed';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> PUSH TO REGISTRY';
                setTimeout(() => status.classList.add('hidden'), 4000);
            }
        });
    </script>
</body>
</html>
