<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provincial Chapter Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div id="accessModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full mx-4 border border-gray-100">
            <div class="text-center mb-8">
                <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-key text-blue-600 text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Chapter Access</h2>
                <p class="text-gray-500 mt-2">Enter your unique chapter passcode</p>
            </div>
            
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1 text-center">Authentication Code</label>
                    <input type="password" id="passcode" placeholder="••••" required maxlength="15"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition text-center text-2xl tracking-widest">
                </div>

                <div id="loginError" class="hidden text-red-500 text-sm text-center font-medium animate-pulse">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Invalid Passcode
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-200 transition-all active:scale-95">
                    Verify & Access
                </button>
            </form>
        </div>
    </div>

    <main id="mainContent" class="hidden w-full max-w-xl bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-8 text-white">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-bold">Post Link Submission</h1>
                    <p id="welcomeMessage" class="text-blue-100 text-sm mt-1"></p>
                </div>
                <button onclick="location.reload()" class="text-xs bg-white/20 hover:bg-white/30 px-3 py-1 rounded-lg transition">
                    Logout
                </button>
            </div>
        </div>

        <form id="submissionForm" class="p-8 space-y-6">
            <div class="space-y-2">
                <label class="text-sm font-bold text-gray-700 uppercase tracking-wider">Facebook Link</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                        <i class="fa-brands fa-facebook-f"></i>
                    </span>
                    <input type="url" id="fbLink" placeholder="https://www.facebook.com/posts/..." required 
                        class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:border-blue-500 outline-none transition">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-sm font-bold text-gray-700 uppercase tracking-wider">Brief Description</label>
                <textarea id="caption" rows="3" placeholder="What is this post about?" 
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:border-blue-500 outline-none transition"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-100 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Submit to Database
            </button>
        </form>
        
        <div id="status" class="hidden mx-8 mb-8 p-4 rounded-xl text-center"></div>
    </main>

    <script>
        // --- 1. CONFIGURATION ---
        // Paste your Google Web App URL here
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwWbO5jcFHW1blWSSQ33a7ARif3gJienYEfU1oVzFz22aPZmq6yrXoo83XpJxeRoAxe/exec';

        const passcodeMap = {
            "2006-01-24": { name: "WILLIE ASUNCION", chapter: "CURRIMAO CHAPTER" },
            "C102": { name: "Maria Clara", chapter: "Chapter 2 - South" },
            "C103": { name: "Jose Rizal", chapter: "Chapter 3 - East" },
            "C104": { name: "Andres Bonifacio", chapter: "Chapter 4 - West" },
            "ADM2026": { name: "Head Correspondent", chapter: "Central Office" }
            // Add your other 18 chapters here
        };

        const accessModal = document.getElementById('accessModal');
        const mainContent = document.getElementById('mainContent');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const welcomeMessage = document.getElementById('welcomeMessage');

        // --- 2. ACCESS LOGIC ---
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const code = document.getElementById('passcode').value;

            if (passcodeMap[code]) {
                const userData = passcodeMap[code];
                sessionStorage.setItem('user', userData.name);
                sessionStorage.setItem('chapter', userData.chapter);
                
                welcomeMessage.innerText = `${userData.chapter} | Correspondent: ${userData.name}`;
                accessModal.classList.add('hidden');
                mainContent.classList.remove('hidden');
            } else {
                loginError.classList.remove('hidden');
                document.getElementById('passcode').value = '';
            }
        });

        // --- 3. GOOGLE SHEETS SUBMISSION LOGIC ---
        document.getElementById('submissionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const status = document.getElementById('status');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> Uploading to Sheets...';

            // Data payload
            const formData = {
                name: sessionStorage.getItem('user'),
                chapter: sessionStorage.getItem('chapter'),
                link: document.getElementById('fbLink').value,
                caption: document.getElementById('caption').value
            };

            // Send to Google Sheets via fetch
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Important for Google Apps Script
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                // Since 'no-cors' doesn't return a readable body, we assume success if no error is thrown
                status.classList.remove('hidden');
                status.className = "mx-8 mb-8 p-4 rounded-xl text-center bg-emerald-50 text-emerald-700 font-medium border border-emerald-100 animate-bounce";
                status.innerText = "Success! Link recorded in Google Sheets.";
                this.reset();
            })
            .catch(error => {
                status.classList.remove('hidden');
                status.className = "mx-8 mb-8 p-4 rounded-xl text-center bg-red-50 text-red-700 font-medium border border-red-100";
                status.innerText = "Error: Network issue or invalid URL.";
                console.error('Error!', error);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit to Database';
                setTimeout(() => status.classList.add('hidden'), 5000);
            });
        });
    </script>
</body>
</html>
