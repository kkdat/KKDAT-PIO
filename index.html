<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provincial Chapter Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Animated Blobs */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(180deg, rgba(79, 70, 229, 0.2) 0%, rgba(30, 58, 138, 0.2) 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            animation: move 25s infinite alternate;
        }

        .blob-1 { top: -10%; left: -10%; animation-delay: 0s; }
        .blob-2 { bottom: -10%; right: -10%; background: rgba(30, 64, 175, 0.15); animation-delay: -5s; }
        .blob-3 { top: 40%; left: 30%; width: 300px; height: 300px; background: rgba(99, 102, 241, 0.1); animation-delay: -10s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 50px) scale(1.1); }
        }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
        }
        
        .portal-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2); }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-6 relative">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="fixed top-8 w-full flex justify-center z-10">
        <div class="bg-white/90 backdrop-blur-md px-6 py-3 rounded-2xl shadow-xl border border-white/20 flex items-center justify-center">
            <img src="LOGO.png" alt="LOGO" class="h-10 w-auto object-contain">
        </div>
    </div>

    <div id="accessModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm">
        <div class="glass-panel rounded-[2.5rem] portal-shadow p-10 max-w-md w-full mx-4 border border-white/40">
            <div class="text-center mb-10">
                <div class="bg-indigo-600/10 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6 transform rotate-3 border border-indigo-500/20">
                    <i class="fa-solid fa-shield-check text-indigo-600 text-3xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-slate-900 tracking-tight">Portal Access</h2>
                <p class="text-slate-500 mt-3 text-sm leading-relaxed">Enter your secure chapter code to push reports to the registry.</p>
            </div>
            
            <form id="loginForm" class="space-y-6">
                <div>
                    <div class="relative">
                        <input type="password" id="passcode" placeholder="••••" required maxlength="15"
                            class="w-full px-6 py-4 bg-white/50 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none transition-all text-center text-2xl tracking-[0.5em] font-bold text-slate-700 placeholder:tracking-normal placeholder:font-normal placeholder:text-sm">
                    </div>
                </div>

                <div id="loginError" class="hidden text-rose-600 text-xs text-center font-bold bg-rose-100/50 py-3 rounded-xl border border-rose-200 uppercase tracking-widest">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Invalid Credential
                </div>

                <button type="submit" class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-[0.98] flex items-center justify-center gap-3">
                    Verify Identity <i class="fa-solid fa-chevron-right text-xs opacity-50"></i>
                </button>
            </form>
            <p class="text-center text-[10px] text-slate-400 mt-8 uppercase tracking-[0.2em] font-bold">Encrypted Connection</p>
        </div>
    </div>

    <main id="mainContent" class="hidden w-full max-w-xl glass-panel rounded-[2.5rem] portal-shadow overflow-hidden border border-white/40">
        <div class="bg-slate-900 p-10 text-white relative">
            <div class="absolute top-0 right-0 p-8 opacity-5">
                <i class="fa-solid fa-paper-plane text-8xl rotate-12"></i>
            </div>
            <div class="relative z-10">
                <div class="flex items-center justify-between mb-6">
                    <span class="bg-indigo-500/20 text-indigo-300 text-[10px] font-bold px-3 py-1 rounded-full border border-indigo-500/30 uppercase tracking-tighter">Verified Session</span>
                    <button onclick="location.reload()" class="text-[10px] uppercase tracking-widest font-bold text-slate-400 hover:text-white transition flex items-center">
                        <i class="fa-solid fa-power-off mr-2"></i> End Session
                    </button>
                </div>
                <h1 class="text-3xl font-bold tracking-tight">Post Link Submission</h1>
                <p id="welcomeMessage" class="text-slate-400 text-sm mt-2 font-medium"></p>
            </div>
        </div>

        <form id="submissionForm" class="p-10 space-y-8">
            <div class="space-y-3">
                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.15em] ml-1">Facebook Post URL</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-600 transition">
                        <i class="fa-brands fa-facebook-f"></i>
                    </div>
                    <input type="url" id="fbLink" placeholder="https://www.facebook.com/..." required 
                        class="w-full pl-12 pr-6 py-4 bg-white/50 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none transition-all placeholder:text-slate-300">
                </div>
            </div>

            <div class="space-y-3">
                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.15em] ml-1">Contextual Description</label>
                <textarea id="caption" rows="4" placeholder="Briefly describe the significance..." 
                    class="w-full px-6 py-4 bg-white/50 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:bg-white outline-none transition-all placeholder:text-slate-300 resize-none"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-5 rounded-2xl shadow-xl shadow-indigo-200 transition-all flex items-center justify-center gap-3 active:scale-[0.98]">
                <i class="fa-solid fa-cloud-arrow-up"></i> Push to Registry
            </button>
        </form>
        
        <div id="status" class="hidden mx-10 mb-10 p-5 rounded-2xl text-center font-bold text-sm"></div>
    </main>

    <script>
        // --- 1. CONFIGURATION ---
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwWbO5jcFHW1blWSSQ33a7ARif3gJienYEfU1oVzFz22aPZmq6yrXoo83XpJxeRoAxe/exec';

        const passcodeMap = {
            "2006-01-24": { name: "WILLIE ASUNCION", chapter: "CURRIMAO CHAPTER" },
            "C102": { name: "Maria Clara", chapter: "Chapter 2 - South" },
            "C103": { name: "Jose Rizal", chapter: "Chapter 3 - East" },
            "C104": { name: "Andres Bonifacio", chapter: "Chapter 4 - West" },
            "ADM2026": { name: "Head Correspondent", chapter: "Central Office" }
        };

        const accessModal = document.getElementById('accessModal');
        const mainContent = document.getElementById('mainContent');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const welcomeMessage = document.getElementById('welcomeMessage');

        // --- 2. ACCESS LOGIC ---
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const code = document.getElementById('passcode').value;

            if (passcodeMap[code]) {
                const userData = passcodeMap[code];
                sessionStorage.setItem('user', userData.name);
                sessionStorage.setItem('chapter', userData.chapter);
                
                welcomeMessage.innerHTML = `<i class="fa-solid fa-user-check text-indigo-400 mr-2"></i> ${userData.name} | <span class="text-white">${userData.chapter}</span>`;
                accessModal.classList.add('hidden');
                mainContent.classList.remove('hidden');
            } else {
                loginError.classList.remove('hidden');
                document.getElementById('passcode').value = '';
            }
        });

        // --- 3. GOOGLE SHEETS SUBMISSION LOGIC ---
        document.getElementById('submissionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const status = document.getElementById('status');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i> Finalizing Sync...';

            const formData = {
                name: sessionStorage.getItem('user'),
                chapter: sessionStorage.getItem('chapter'),
                link: document.getElementById('fbLink').value,
                caption: document.getElementById('caption').value
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                status.classList.remove('hidden');
                status.className = "mx-10 mb-10 p-5 rounded-2xl text-center bg-emerald-500/10 text-emerald-700 border border-emerald-500/20 font-bold text-sm shadow-sm";
                status.innerHTML = '<i class="fa-solid fa-circle-check mr-2"></i> Record successfully pushed to registry';
                this.reset();
            })
            .catch(error => {
                status.classList.remove('hidden');
                status.className = "mx-10 mb-10 p-5 rounded-2xl text-center bg-rose-500/10 text-rose-700 border border-rose-500/20 font-bold text-sm";
                status.innerText = "Error: Network sync failure.";
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Push to Registry';
                setTimeout(() => status.classList.add('hidden'), 5000);
            });
        });
    </script>
</body>
</html>
