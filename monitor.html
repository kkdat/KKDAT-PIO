<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provincial Monitoring Console - Full Registry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d1b3e; font-family: 'Inter', sans-serif; color: white; min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .status-btn { transition: all 0.3s ease; }
        .status-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-shared { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        
        /* Auth Overlay Style */
        #authOverlay { background: radial-gradient(circle at center, #1e293b 0%, #0d1b3e 100%); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="authOverlay" class="fixed inset-0 z-50 flex items-center justify-center p-6">
        <div class="max-w-md w-full glass-card p-10 rounded-[2.5rem] border border-white/20 shadow-2xl text-center">
            <div class="w-20 h-20 bg-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-lg">
                <i class="fa-solid fa-user-shield text-3xl text-white"></i>
            </div>
            <h2 class="text-2xl font-black mb-2 tracking-tight">Admin Entry</h2>
            <p class="text-slate-400 text-sm mb-8">Access restricted to authorized personnel.</p>
            
            <form id="authForm" class="space-y-4">
                <input type="password" id="passInput" placeholder="Enter Passcode" required
                    class="w-full bg-white/5 border-2 border-white/10 rounded-2xl py-4 px-6 text-center text-xl font-bold tracking-[0.3em] focus:border-indigo-500 focus:outline-none transition-all outline-none">
                <div id="authError" class="hidden text-rose-500 text-[10px] font-black uppercase tracking-widest bg-rose-500/10 py-2 rounded-lg">
                    Invalid Passcode
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl hover:bg-indigo-500 transition-all active:scale-95 shadow-xl">
                    UNLOCK CONSOLE
                </button>
            </form>
            <a href="index.html" class="inline-block mt-8 text-[9px] text-slate-500 font-bold uppercase tracking-widest hover:text-slate-300">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to Hub
            </a>
        </div>
    </div>

    <div id="mainContent" class="hidden max-w-[1400px] mx-auto">
        <div class="flex flex-col md:flex-row items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Full Monitoring Registry</h1>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> <span id="adminDisplay">Admin Console</span>
                </p>
            </div>
            <div class="flex items-center gap-3">
                 <button onclick="location.reload()" class="mr-4 text-[10px] font-black text-slate-500 hover:text-rose-400 transition-colors uppercase tracking-widest">
                    <i class="fa-solid fa-power-off mr-1"></i> Logout
                </button>
                <div class="flex items-center gap-3 bg-white/5 p-2 pr-5 rounded-full border border-white/10">
                    <img src="LOGO.png" alt="Logo" class="w-10 h-10 rounded-full object-cover border border-white/20">
                    <div class="text-left"><div class="text-[9px] font-bold text-slate-500 uppercase">Registry System</div><div class="text-xs font-bold uppercase">Admin Console</div></div>
                </div>
            </div>
        </div>

        <div class="glass-card rounded-3xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[1000px]">
                    <thead class="bg-white/5 border-b border-white/10 uppercase text-[10px] tracking-widest font-bold text-slate-400">
                        <tr>
                            <th class="px-6 py-4">Timestamp</th>
                            <th class="px-6 py-4">Chapter / Name</th>
                            <th class="px-6 py-4">Description</th>
                            <th class="px-6 py-4">FB Link</th>
                            <th class="px-6 py-4 text-center">Status Action</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable" class="divide-y divide-white/5 text-sm">
                        <tr><td colspan="5" class="p-20 text-center"><i class="fa-solid fa-circle-notch animate-spin text-2xl text-indigo-500 mb-2"></i><br><span class="text-slate-500 text-xs font-bold uppercase tracking-widest">Loading Registry...</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-6 flex justify-center"><button onclick="loadData()" class="px-5 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-[10px] font-bold uppercase tracking-widest transition-all"><i class="fa-solid fa-rotate mr-2"></i> Refresh Table</button></div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxSmZA6acSmshOi1tGOSmaBEevXN0v0nzH84BRe01XeiNctjgNSrb_g3oRIxTpQJlUI/exec';

        // Authorized Users
        const authorizedUsers = {
            "2009-05-13": "XYBERGHTEIN EURY VALERA",
            "1996-11-06": "DARWIN AGULLANA"
        };

        const authForm = document.getElementById('authForm');
        const authOverlay = document.getElementById('authOverlay');
        const mainContent = document.getElementById('mainContent');
        const authError = document.getElementById('authError');
        const adminDisplay = document.getElementById('adminDisplay');

        // Handle Authentication
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const passcode = document.getElementById('passInput').value;

            if (authorizedUsers[passcode]) {
                adminDisplay.innerText = `Welcome, ${authorizedUsers[passcode]}`;
                authOverlay.classList.add('hidden');
                mainContent.classList.remove('hidden');
                loadData(); // Start loading data only after login
            } else {
                authError.classList.remove('hidden');
                document.getElementById('passInput').value = '';
                // Simple vibration/shake effect
                authForm.classList.add('translate-x-1');
                setTimeout(() => authForm.classList.remove('translate-x-1'), 100);
            }
        });

        async function loadData() {
            try {
                const response = await fetch(`${API_URL}?action=getData`);
                const data = await response.json();
                const container = document.getElementById('dataTable');
                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<tr><td colspan="5" class="p-20 text-center text-slate-500 font-bold uppercase tracking-widest">No entries found.</td></tr>';
                    return;
                }

                data.forEach((row) => {
                    const isShared = row.status === "SHARED";
                    const date = new Date(row.timestamp).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    
                    container.innerHTML += `
                        <tr class="hover:bg-white/5 transition-colors group">
                            <td class="px-6 py-4 text-slate-400 text-xs whitespace-nowrap">${date !== 'Invalid Date' ? date : '---'}</td>
                            <td class="px-6 py-4">
                                <div class="font-bold text-white group-hover:text-indigo-400 transition-colors">${row.chapter}</div>
                                <div class="text-[10px] text-slate-500 font-medium uppercase">${row.name}</div>
                            </td>
                            <td class="px-6 py-4 max-w-xs"><p class="text-slate-400 text-xs line-clamp-2 italic">"${row.caption || 'No description'}"</p></td>
                            <td class="px-6 py-4">
                                <a href="${row.link}" target="_blank" class="inline-flex items-center gap-2 px-3 py-1.5 bg-indigo-500/10 hover:bg-indigo-500/30 text-indigo-400 rounded-lg text-[10px] font-bold border border-indigo-500/20 transition-all">
                                    <i class="fa-brands fa-facebook-f"></i> VIEW
                                </a>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <button onclick="toggleStatus(${row.rowId}, '${row.status}', event)" 
                                    class="status-btn px-4 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest ${isShared ? 'status-shared' : 'status-pending'}">
                                    <i class="fa-solid ${isShared ? 'fa-check-circle' : 'fa-clock'} mr-1"></i> ${row.status || 'PENDING'}
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                document.getElementById('dataTable').innerHTML = '<tr><td colspan="5" class="p-20 text-center text-rose-400 font-bold uppercase tracking-widest">Sync Error. Check Deployment.</td></tr>';
            }
        }

        function toggleStatus(rowId, currentStatus, event) {
            const btn = event.currentTarget;
            const newStatus = currentStatus === "SHARED" ? "PENDING" : "SHARED";
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin"></i>';
            btn.disabled = true;

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ action: 'updateStatus', row: rowId, status: newStatus })
            }).then(() => setTimeout(loadData, 1000));
        }
    </script>
</body>
</html>
