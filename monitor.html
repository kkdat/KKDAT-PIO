<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provincial Monitoring Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #0d1b3e; 
            font-family: 'Inter', sans-serif; 
            color: white; 
            min-height: screen;
        }
        /* Glassmorphism Effect */
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        /* Custom Scrollbar for the table */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        .status-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .status-pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-shared { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        
        /* Loading Animation */
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row items-center justify-between mb-10 gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-black tracking-tight mb-2 bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                    Monitoring Console
                </h1>
                <p class="text-slate-400 text-sm font-medium tracking-wide flex items-center justify-center md:justify-start gap-2 uppercase">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Provincial Office Registry Data
                </p>
            </div>
            
            <div class="flex items-center gap-4 bg-white/5 p-2 pr-6 rounded-full border border-white/10">
                <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center border border-white/20 overflow-hidden">
                    <img src="LOGO.png" alt="Logo" class="w-10 h-10 object-cover rounded-full">
                </div>
                <div class="text-left">
                    <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Authorized User</div>
                    <div class="text-sm font-bold">PROVINCIAL ADMIN</div>
                </div>
            </div>
        </div>

        <div class="glass-card rounded-[2.5rem] overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-white/5 border-b border-white/10 uppercase text-[11px] tracking-[0.2em] font-bold text-slate-400">
                        <tr>
                            <th class="px-8 py-5">Chapter Information</th>
                            <th class="px-8 py-5">Submission Link</th>
                            <th class="px-8 py-5 text-center">Current Status</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable" class="divide-y divide-white/5">
                        <tr>
                            <td colspan="3" class="p-20 text-center">
                                <i class="fa-solid fa-circle-notch animate-spin text-3xl text-indigo-500 mb-4"></i>
                                <div class="text-slate-500 font-bold uppercase tracking-widest text-xs">Accessing Google Sheets...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-8 flex justify-center">
            <button onclick="loadData()" class="px-6 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                <i class="fa-solid fa-rotate"></i> Manual Refresh
            </button>
        </div>
    </div>

    <script>
        // CRITICAL: Replace this with your current 'Anyone' Deployment Web App URL
        const API_URL = 'https://script.google.com/macros/s/AKfycbxSmZA6acSmshOi1tGOSmaBEevXN0v0nzH84BRe01XeiNctjgNSrb_g3oRIxTpQJlUI/exec';

        async function loadData() {
            try {
                const response = await fetch(`${API_URL}?action=getData`);
                const data = await response.json();
                const container = document.getElementById('dataTable');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<tr><td colspan="3" class="p-20 text-center text-slate-500 uppercase tracking-widest font-bold">No submissions found in registry.</td></tr>';
                    return;
                }

                data.forEach((row) => {
                    const isShared = row.status === "SHARED";
                    container.innerHTML += `
                        <tr class="hover:bg-white/5 transition-colors group">
                            <td class="px-8 py-6">
                                <div class="font-bold text-base text-white group-hover:text-indigo-400 transition-colors">${row.chapter}</div>
                                <div class="text-[11px] text-slate-500 font-bold flex items-center gap-2">
                                    <i class="fa-solid fa-user text-[10px]"></i> ${row.name}
                                </div>
                            </td>
                            <td class="px-8 py-6">
                                <a href="${row.link}" target="_blank" 
                                   class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 rounded-xl text-xs font-bold border border-indigo-500/20 transition-all">
                                    <i class="fa-brands fa-facebook-f"></i> Open Link
                                </a>
                            </td>
                            <td class="px-8 py-6 text-center">
                                <button onclick="toggleStatus(${row.rowId}, '${row.status}', event)" 
                                    class="status-btn px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest ${isShared ? 'status-shared' : 'status-pending'}">
                                    <i class="fa-solid ${isShared ? 'fa-check-circle' : 'fa-clock'} mr-1"></i>
                                    ${row.status || 'PENDING'}
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Sync Error:', error);
                document.getElementById('dataTable').innerHTML = `
                    <tr>
                        <td colspan="3" class="p-20 text-center">
                            <div class="text-rose-400 font-bold mb-2 uppercase tracking-widest">Connection Error</div>
                            <div class="text-slate-500 text-xs italic text-balance font-medium">Please check your Apps Script deployment and ensure "Who has access" is set to "Anyone".</div>
                        </td>
                    </tr>`;
            }
        }

        function toggleStatus(rowId, currentStatus, event) {
            const btn = event.currentTarget;
            const newStatus = currentStatus === "SHARED" ? "PENDING" : "SHARED";
            
            // Visual feedback: Spin icon and change text immediately
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin mr-1"></i> Syncing...';
            
            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify({ 
                    action: 'updateStatus', 
                    row: rowId, 
                    status: newStatus 
                })
            }).then(() => {
                // Short timeout to allow Google Sheets to process before refreshing
                setTimeout(loadData, 1000);
            }).catch(err => {
                console.error('Update Failed:', err);
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            });
        }

        // Auto-load when the page opens
        window.onload = loadData;
    </script>
</body>
</html>
